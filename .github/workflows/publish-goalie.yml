name: Validate football and goalie-pull calculators
on:
  push:
    branches: [main]
    paths:
      - 'goalie-pull/**'
      - 'football-80/**'
      - 'scripts/test-goalie.cjs'
      - 'scripts/test-football.cjs'
      - '.github/workflows/publish-goalie.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate goalie-pull calculator
        run: node scripts/test-goalie.cjs
      - name: Validate football calculator
        run: node scripts/test-football.cjs
      - name: Publication handled by the main First Twenty workflow
        run: echo 'Validation passed. Pages deployment is performed only by daily.yml.'

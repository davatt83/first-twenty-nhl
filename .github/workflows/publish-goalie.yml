name: Publish football and goalie-pull calculators
on:
  push:
    branches: [main]
    paths: ['goalie-pull/**', 'football-80/**', 'scripts/test-football.cjs', '.github/workflows/publish-goalie.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: first-twenty-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check embedded goalie model
        run: node scripts/test-goalie.cjs
      - name: Check football controls
        run: node scripts/test-football.cjs
      - name: Stage all calculators
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R goalie-pull _site/goalie-pull
          if [ -d football-80 ]; then cp -R football-80 _site/football-80; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy

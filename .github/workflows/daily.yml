name: Update and publish First Twenty NHL

on:
  # After installing all other files, commit this workflow LAST to initiate setup.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'index.html'
      - 'scripts/engine.js'
      - 'model.template.html'
  schedule:
    # GitHub schedules use UTC; separate runs cover EDT and EST.
    # GitHub may delay scheduled jobs, so 4:00 a.m. is a target, not a guarantee.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Publish the last verified embedded snapshot without contacting NHL servers"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: first-twenty-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Run only at the appropriate Toronto 4 a.m. slot
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Toronto date +%z)
          echo "Toronto UTC offset: $offset"
          if [ "$EVENT" = 'push' ] || [ "$EVENT" = 'workflow_dispatch' ] || { [ "$SCHEDULE" = '0 8 * * *' ] && [ "$offset" = '-0400' ]; } || { [ "$SCHEDULE" = '0 9 * * *' ] && [ "$offset" = '-0500' ]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the latest data and model
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Node.js
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backfill historical 2025–26 first-period results
        if: steps.clock.outputs.run == 'true'
        timeout-minutes: 35
        continue-on-error: true
        env:
          FIRST_TWENTY_HISTORY_BATCH: 60
        run: node scripts/backfill-2025.mjs
      - name: Persist verified historical game days independently
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/games-20252026.json
          if git diff --cached --quiet; then
            echo 'Historical data unchanged.'
          else
            git commit -m "Backfill verified 2025-26 first periods"
            git push
          fi
      - name: Analyze first-period goal distribution and team tendencies
        if: steps.clock.outputs.run == 'true'
        run: node scripts/research-2025.mjs
      - name: Preserve completed reproducible research report
        if: steps.clock.outputs.run == 'true'
        run: |
          if [ -f RESEARCH_2025_26.md ] && [ -f data/research-2025.json ]; then
            git add RESEARCH_2025_26.md data/research-2025.json
            if git diff --cached --quiet; then
              echo 'Research results unchanged.'
            else
              git commit -m "Publish research on 2025-26 first-period scoring"
              git push
            fi
          else
            echo 'Research deferred until the verified season is complete.'
          fi
      - name: Validate embedded snapshot before publishing
        if: steps.clock.outputs.run == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only))
        run: |
          node scripts/test.mjs
          node scripts/fixture-test.mjs
          node scripts/test-v2.mjs
          node scripts/test-backfill.mjs
      - name: Retrieve and verify all completed first periods
        if: steps.clock.outputs.run == 'true' && !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only))
        run: node scripts/update.mjs
      - name: Build and validate embedded browser model
        if: steps.clock.outputs.run == 'true' && !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only))
        run: |
          node scripts/build.mjs
          node scripts/test.mjs
          node scripts/fixture-test.mjs
          node scripts/test-v2.mjs
          node scripts/test-backfill.mjs
      - name: Preserve verified database and calculator in git
        if: steps.clock.outputs.run == 'true' && !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_only))
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add index.html data/games-20262027.json data/coverage.json data/games-20252026.json
          if git diff --cached --quiet; then
            echo 'Verified data unchanged.'
          else
            git commit -m "Update verified NHL first-period data"
            git push
          fi
      - name: Prepare HTML for GitHub Pages
        if: steps.clock.outputs.run == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        if: steps.clock.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy this exact validated version
        if: steps.clock.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
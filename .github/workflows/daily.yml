name: Update and publish First Twenty NHL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'model.template.html'
      - 'index.html'
      - 'scripts/**'
      - 'data/**'
  schedule:
    # 04:00 Toronto, with a 07:00 retry in case NHL sources are late.
    # GitHub schedules can run later than their cron times.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Only rebuild/deploy the already verified records (do not poll NHL)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: first-twenty-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enforce 4am / 7am America-Toronto schedule
        id: clock
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Toronto date +%z)
          echo "Toronto UTC offset: $offset"
          if [ "$EVENT" = 'push' ] || [ "$EVENT" = 'workflow_dispatch' ] || { [ "$SCHEDULE" = '0 8 * * *' ] && [ "$offset" = '-0400' ]; } || { [ "$SCHEDULE" = '0 9 * * *' ] && [ "$offset" = '-0500' ]; } || { [ "$SCHEDULE" = '0 11 * * *' ] && [ "$offset" = '-0400' ]; } || { [ "$SCHEDULE" = '0 12 * * *' ] && [ "$offset" = '-0500' ]; }; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out model and most recent verified records
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Install Node.js 22
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate updater syntax
        if: steps.clock.outputs.run == 'true'
        run: node --check scripts/update.mjs
      - name: Retrieve official final games and verify first periods
        if: steps.clock.outputs.run == 'true' && github.event_name != 'push' && !inputs.publish_only
        timeout-minutes: 30
        env:
          FIRST_TWENTY_WORKERS: 3
        run: node scripts/update.mjs
      - name: Rebuild calculator from validated records
        if: steps.clock.outputs.run == 'true'
        run: node scripts/build.mjs
      - name: Verify data, historical sample, UI features and synthetic boxscores
        if: steps.clock.outputs.run == 'true'
        run: |
          node scripts/test.mjs
          node scripts/fixture-test.mjs
          node scripts/test-v2.mjs
          node scripts/test-backfill.mjs
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('data/games-20262027.json'));const c=JSON.parse(fs.readFileSync('data/coverage.json'));if(!j.meta.complete||!c.meta.complete||j.games.length!==c.meta.verifiedGames)process.exit(1);if(new Set(j.games.map(x=>x.id)).size!==j.games.length)process.exit(1);console.log('Verified coverage:',j.meta.checkedThrough,j.games.length,'unique games');"
      - name: Persist verified database and public calculator only after all tests pass
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/games-20262027.json data/coverage.json index.html
          if git diff --cached --quiet; then
            echo 'No changes to verified model or coverage. Publishing same validated version.'
          else
            git commit -m "Refresh verified NHL first periods and rebuild public calculator"
            git push
          fi
      - name: Prepare exact verified site
        if: steps.clock.outputs.run == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        if: steps.clock.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        if: steps.clock.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the verified calculator to the stable URL
        if: steps.clock.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
